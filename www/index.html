<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EFE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1814" media="(prefers-color-scheme: dark)">
<meta name="description" content="Jatah. A daily allowance budget tracker that keeps everything on your phone.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jatah.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Jatah.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-thumb phone app. Big "available today" number on top, everything else in quiet cards, tab bar at the bottom. */
/* Palette: pastel latte browns for the app itself; three pastel states for money.
   safe = green, danger (running low) = orange, debt (below zero) = red.
   Each state has a fill (rings, dots), a soft tint (backgrounds) and an -ink shade dark enough for text. */
:root{
  --bg:#F6EFE7; --surface:#FFFBF6; --ink:#4A3B30; --muted:#8A7766; --line:#EBDFD2;
  --accent:#B08968; --accent-ink:#FFFFFF; --accent-soft:#F1E5D8; --accent-text:#8A6444;
  --safe:#93C5A0; --safe-soft:#E4F2E7; --safe-ink:#4C8A5D;
  --danger:#F3B37C; --danger-soft:#FDEBD9; --danger-ink:#B4692B;
  --debt:#EC9590; --debt-soft:#FBE1DF; --debt-ink:#B54C47;
  --shadow:rgba(110,80,55,.14);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1814; --surface:#28211C; --ink:#F2E7DB; --muted:#B19F8E; --line:#3B3129;
    --accent:#CBA383; --accent-ink:#2A1F17; --accent-soft:#3A2E25; --accent-text:#DDBB9C;
    --safe:#94C9A1; --safe-soft:#25332A; --safe-ink:#A9D9B5;
    --danger:#F2B784; --danger-soft:#3D2E20; --danger-ink:#F6C79D;
    --debt:#EE9C97; --debt-soft:#402624; --debt-ink:#F4B1AC;
    --shadow:rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1814; --surface:#28211C; --ink:#F2E7DB; --muted:#B19F8E; --line:#3B3129;
  --accent:#CBA383; --accent-ink:#2A1F17; --accent-soft:#3A2E25; --accent-text:#DDBB9C;
  --safe:#94C9A1; --safe-soft:#25332A; --safe-ink:#A9D9B5;
  --danger:#F2B784; --danger-soft:#3D2E20; --danger-ink:#F6C79D;
  --debt:#EE9C97; --debt-soft:#402624; --debt-ink:#F4B1AC;
  --shadow:rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 112px)}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:4px 2px 14px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--accent-text)}
.when{color:var(--muted);font-size:13px;text-align:right}
main{display:flex;flex-direction:column;gap:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{font-family:var(--display);font-weight:600;font-size:16px;margin:0 0 10px;text-wrap:balance}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.hero{padding:18px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.gauge{position:relative;width:min(260px, 72vw);aspect-ratio:1}
.gauge svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
/* The gauge takes its colours from its state class: safe / danger / debt. */
.gauge{--fill:var(--safe);--soft:var(--safe-soft);--text:var(--ink)}
.gauge.danger{--fill:var(--danger);--soft:var(--danger-soft);--text:var(--danger-ink)}
.gauge.debt{--fill:var(--debt);--soft:var(--debt-soft);--text:var(--debt-ink)}
.gauge .track{stroke:var(--soft);transition:stroke .4s}
.gauge .arc{stroke:var(--fill);stroke-linecap:round;transition:stroke .4s}
.gauge .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 21%}
.gauge .big{font-family:var(--display);font-weight:800;line-height:1.05;letter-spacing:-.03em;margin:4px 0 8px;white-space:nowrap;color:var(--text);transition:color .4s}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--text)}
.gauge .status{background:var(--soft)}
.gauge.safe .status{color:var(--safe-ink)}
.status i{width:8px;height:8px;border-radius:99px;background:var(--fill)}
.hero .sub{font-size:13.5px;color:var(--muted);text-align:center;max-width:34ch;text-wrap:balance}

/* Motion. Everything below is skipped for people who turned animations off. */
@media (prefers-reduced-motion: no-preference){
  .gauge .arc{transition:stroke-dashoffset 1s cubic-bezier(.22,1,.36,1), stroke .4s}
  .gauge.spin svg{animation:spin 1.1s cubic-bezier(.22,1,.36,1)}
  @keyframes spin{from{transform:rotate(-450deg)}to{transform:rotate(-90deg)}}
  .gauge.spin .center{animation:pop .6s .25s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  .gauge.debt .status i, .gauge.danger .status i{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.5);opacity:.5}}

  main.enter > *{animation:rise .5s cubic-bezier(.22,1,.36,1) both}
  main.enter > *:nth-child(2){animation-delay:.06s}
  main.enter > *:nth-child(3){animation-delay:.12s}
  main.enter > *:nth-child(4){animation-delay:.18s}
  main.enter > *:nth-child(n+5){animation-delay:.24s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .item.new{animation:slidein .45s cubic-bezier(.22,1,.36,1) both}
  @keyframes slidein{from{opacity:0;transform:translateX(-12px);background:var(--accent-soft)}to{opacity:1;transform:none}}
  .day .detail{animation:rise .3s ease-out both}

  nav.tabs button svg{transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
  nav.tabs button[aria-current="page"] svg{transform:translateY(-2px) scale(1.1)}
  nav.tabs .add .plus{transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
  nav.tabs .add .plus svg{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
  nav.tabs .add:hover .plus svg, nav.tabs .add:active .plus svg{transform:rotate(90deg)}
  .btn, .chip, .x{transition:transform .15s, background .2s}
  .btn:active, .chip:active{transform:scale(.96)}
  .sheet-bg.open{animation:fade .2s ease-out}
  @keyframes fade{from{opacity:0}}
  .sheet-bg.closing{animation:fadeout .22s ease-in forwards}
  .sheet-bg.closing .sheet{animation:sheetdown .22s ease-in forwards}
  @keyframes fadeout{to{opacity:0}}
  @keyframes sheetdown{to{transform:translateY(48px);opacity:0}}
  .onboard.open{animation:fade .25s ease-out}
  .onboard.leaving{animation:fadeout .25s ease-in forwards}
  .ob-body.fwd{animation:stepfwd .4s cubic-bezier(.22,1,.36,1)}
  .ob-body.bwd{animation:stepbwd .4s cubic-bezier(.22,1,.36,1)}
  @keyframes stepfwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
  @keyframes stepbwd{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
  .ob-mark .ob-arc{animation:obsweep 1.2s .15s cubic-bezier(.22,1,.36,1) both}
  @keyframes obsweep{from{stroke-dashoffset:289}}
  .bell.ring svg{animation:bellring .9s ease-in-out}
  @keyframes bellring{15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}75%{transform:rotate(2deg)}}
  .bell .badge{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
}

.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted)}
.row .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.row.total{border-top:1px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:10px}
.row.total .k{color:var(--ink);font-weight:600}
.neg-t{color:var(--debt-ink)} .pos-t{color:var(--safe-ink)} .warn-t{color:var(--danger-ink)}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent-text)}
.pill.bad{background:var(--debt-soft);color:var(--debt-ink)}
.pill.warn{background:var(--danger-soft);color:var(--danger-ink)}
.note{border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--danger-soft);color:var(--danger-ink)}
.note.info{background:var(--accent-soft);color:var(--accent-text)}
.note button{margin-left:auto;background:none;border:0;font-weight:700;color:inherit;padding:0 4px}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:12.5px;color:var(--muted)}
.item .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:18px;line-height:1}
.x:hover{background:var(--bg);color:var(--debt-ink)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent-text);border:1px solid var(--line)}
.btn.danger{background:var(--debt-ink);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);
  border-radius:22px 22px 0 0;box-shadow:0 -6px 24px var(--shadow);
  padding:8px 8px calc(env(safe-area-inset-bottom) + 8px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;gap:2px}
nav.tabs button{border:0;background:none;padding:6px 2px;border-radius:12px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{color:var(--accent-text)}
nav.tabs .add{color:var(--accent-text);font-weight:700;padding-top:0}
nav.tabs .add .plus{width:64px;height:64px;margin-top:-34px;border-radius:99px;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;border:5px solid var(--surface);box-shadow:0 8px 18px var(--shadow)}
nav.tabs .add .plus svg{width:28px;height:28px}
nav.tabs .add:active .plus{transform:scale(.94)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12.5px;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:16px}
.inp.big{font-family:var(--display);font-size:28px;font-weight:600;padding:10px 14px}
.form{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center;
  padding-bottom:var(--kb, 0px);transition:padding-bottom .2s ease-out}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:92%;overflow:auto}
.sheet h3{font-family:var(--display);font-size:20px;margin:0 0 14px}
.grip{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav b{font-family:var(--display);font-size:18px}
.monthnav button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.monthnav button:disabled{opacity:.35}

.days{display:flex;flex-direction:column}
.day{border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day > button{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;border:0;background:none;padding:10px 0;text-align:left}
.day .d{font-weight:700}
.day .d small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.day .sp{font-size:13px;color:var(--muted)}
.day .bal{font-weight:700;font-variant-numeric:tabular-nums}
.day .detail{padding:0 0 10px 62px}
.day.today > button .d{color:var(--accent-text)}
.bar{height:4px;border-radius:9px;background:var(--line);margin-top:5px;overflow:hidden;max-width:180px}
.bar i{display:block;height:100%;background:var(--safe)}
.bar i.over{background:var(--debt)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);z-index:30;width:max-content;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;font-size:14px;max-width:calc(100% - 32px);
  box-shadow:0 8px 24px var(--shadow);
  opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%, 12px) scale(.96);
  transition:opacity .25s ease, transform .25s ease, visibility 0s linear .25s}
.toast.show{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%, 0) scale(1);
  transition:opacity .25s ease, transform .35s cubic-bezier(.34,1.56,.64,1), visibility 0s}
@media (prefers-reduced-motion: reduce){ .toast, .toast.show{transform:translate(-50%, 0)} }
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:700}
textarea.inp{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:110px}
.muted{color:var(--muted)}
.small{font-size:13px}
@media (prefers-reduced-motion: no-preference){
  .sheet-bg.open .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
}

/* Header bell + floating notification panel (takes no space on the page) */
.top{position:relative}
.top-r{display:flex;align-items:flex-start;gap:10px}
.bell{position:relative;flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.bell svg{width:20px;height:20px}
.bell .badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--debt-ink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.bell .badge[hidden]{display:none}
.note-panel{position:fixed;z-index:12;top:calc(env(safe-area-inset-top) + 64px);right:max(16px, calc(50% - 224px));width:min(340px, calc(100vw - 32px));max-height:min(70vh, 520px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 44px var(--shadow);padding:6px;
  opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-8px) scale(.97);transform-origin:top right;
  transition:opacity .2s ease, transform .2s ease, visibility 0s linear .2s}
.note-panel.open{opacity:1;visibility:visible;pointer-events:auto;transform:none;
  transition:opacity .2s ease, transform .28s cubic-bezier(.34,1.56,.64,1), visibility 0s}
.np-head{display:flex;justify-content:space-between;align-items:center;padding:10px 10px 6px}
.np-head b{font-family:var(--display);font-size:17px}
.np-list{display:flex;flex-direction:column;gap:2px}
.np-item{display:flex;gap:10px;padding:10px;border-radius:12px}
.np-item .dot{width:10px;height:10px;border-radius:99px;margin-top:5px;flex:none;background:var(--accent)}
.np-item.debt .dot{background:var(--debt)} .np-item.danger .dot{background:var(--danger)} .np-item.safe .dot{background:var(--safe)}
.np-item.unseen{background:var(--accent-soft)}
.np-item .tt{font-weight:700;font-size:14px}
.np-item .bb{font-size:13px;color:var(--muted)}
.np-item .btn{margin-top:8px}
.np-empty{padding:22px 10px;color:var(--muted);font-size:14px;text-align:center}

/* Spread-out switch in the recurring sheet */
.switch{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer}
.switch[hidden]{display:none}
.switch input{width:20px;height:20px;accent-color:var(--accent);margin:1px 0 0;flex:none}
.switch b{font-size:14px}

/* First-time setup */
.onboard{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;display:none;padding-bottom:var(--kb, 0px)}
/* While the keyboard is up: hide the tab bar and leave room to scroll inputs above the keyboard. */
html.kb-open nav.tabs{transform:translateY(120%);transition:transform .15s}
html.kb-open .app{padding-bottom:calc(var(--kb, 0px) + 24px)}
html.kb-open .sheet{padding-bottom:18px}
.onboard.open{display:block}
.ob{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:20px;
  padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 20px)}
.ob-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.ob-top .back{border:0;background:none;color:var(--accent-text);font-weight:700;padding:8px 0}
.ob-dots{display:flex;gap:6px}
.ob-dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width .3s, background .3s}
.ob-dots i.on{width:22px;background:var(--accent)}
.ob-body{display:flex;flex-direction:column;gap:16px;flex:1}
.ob h1{font-family:var(--display);font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.ob .lead{color:var(--muted);margin:0;max-width:42ch}
.ob-foot{display:flex;flex-direction:column;gap:8px}
.ob-mark{width:104px;height:104px}
.ob-points{display:flex;flex-direction:column;gap:10px;margin:4px 0 0;padding:0;list-style:none}
.ob-points li{display:flex;gap:10px;align-items:center}
.ob-points li::before{content:"";width:8px;height:8px;border-radius:99px;background:var(--safe);flex:none}
.choice{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:15px}
.opt span{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.calc{font-size:14px;color:var(--accent-text);font-weight:600;min-height:1.4em}
.err{color:var(--debt-ink) !important}

/* Money fields: "Rp" in front, dots while typing, filled in with the app's own keypad */
.hint{font-size:12.5px;color:var(--muted)}
.hint:empty{display:none}
.money{position:relative;display:flex;align-items:center}
.money .cur{position:absolute;left:14px;font-family:var(--display);font-weight:600;font-size:19px;color:var(--muted);pointer-events:none}
.money .inp{padding-left:50px;caret-color:transparent;cursor:pointer}
.money.active .inp{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.keypad{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  box-shadow:0 -10px 30px var(--shadow);border-radius:20px 20px 0 0;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);
  transform:translateY(105%);visibility:hidden;transition:transform .25s cubic-bezier(.22,1,.36,1), visibility 0s linear .25s}
.keypad.open{transform:none;visibility:visible;transition:transform .25s cubic-bezier(.22,1,.36,1), visibility 0s}
.kp-in{max-width:480px;margin:0 auto}
.kp-top{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px;gap:12px}
.kp-top span{font-size:13px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kp-top button{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:8px 18px}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp-grid button{height:54px;border:0;border-radius:14px;background:var(--bg);font-family:var(--display);font-size:24px;font-weight:600;color:var(--ink);
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center}
.kp-grid button:active{background:var(--accent-soft)}
.kp-grid .k000{font-size:19px}
.kp-grid .kdel svg{width:26px;height:26px}

/* Spending / Money in switch */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px var(--shadow)}

/* Month ring inside the day ring */
.gauge .track.m{stroke:var(--line)}
.gauge .arc.m{stroke:var(--accent)}
.gauge .arc.m.over{stroke:var(--debt)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:99px;display:inline-block;flex:none}
.amt.in{color:var(--safe-ink)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Jatah<span>.</span></div>
    <div class="top-r">
      <div class="when" id="when"></div>
      <button type="button" class="bell" id="bellBtn" aria-label="Notifications" aria-expanded="false" aria-controls="notePanel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge" id="bellBadge" hidden></span>
      </button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button type="button" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Today</button>
    <button type="button" data-tab="recurring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg>Recurring</button>
    <button type="button" class="add" id="addBtn" aria-label="Add spending"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Add</button>
    <button type="button" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>History</button>
    <button type="button" data-tab="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Setup</button>
  </div>
</nav>

<div class="note-panel" id="notePanel" role="dialog" aria-label="Notifications"></div>
<div class="onboard" id="onboard"></div>

<div class="sheet-bg" id="sheetBg" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet"></div>
</div>
<div class="keypad" id="keypad" aria-hidden="true">
  <div class="kp-in">
    <div class="kp-top"><span id="kpLabel">Amount</span><button type="button" data-key="done">Done</button></div>
    <div class="kp-grid">
      <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
      <button type="button" data-key="000" class="k000">000</button><button type="button" data-key="0">0</button>
      <button type="button" data-key="del" class="kdel" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-6 6M11 9l6 6"/></svg></button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button type="button" id="toastBtn">Undo</button></div>

<script>
/*LOGIC*/
const pad = n => String(n).padStart(2, '0');
const sum = a => a.reduce((t, x) => t + x, 0);
function ymIdx(ym){ const [y, m] = ym.split('-').map(Number); return y * 12 + (m - 1); }
function idxYm(i){ return Math.floor(i / 12) + '-' + pad(i % 12 + 1); }
function daysIn(ym){ const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }

function settingsFor(st, ym){
  if (st.months[ym]) return st.months[ym];
  const keys = Object.keys(st.months).sort();
  let best = null;
  for (const k of keys) if (k <= ym) best = k;
  if (!best) best = keys[0];
  return best ? st.months[best] : { amount: 0, every: 1, daily: 0 };
}
// Budget can arrive every 1-60 months (monthly, per semester, per year...). It's split evenly into months.
function monthlyOf(s){ return s.amount != null ? Math.floor(s.amount / (s.every || 1)) : (s.monthly || 0); }
function dueIn(r, ym){
  if (r.active === false) return false;
  const d = ymIdx(ym) - ymIdx(r.start);
  return d >= 0 && d % r.every === 0;
}
function nextDueAfter(r, ym){ // first due month strictly after ym
  const s = ymIdx(r.start), from = ymIdx(ym) + 1;
  if (from <= s) return r.start;
  const k = Math.ceil((from - s) / r.every) * r.every;
  return idxYm(s + k);
}
const isSpread = r => r.every > 1 && r.spread !== false;
const perMonth = r => Math.ceil(r.amount / r.every);
// What a recurring payment takes out of month `ym`.
// All at once: the full amount in each month it's due.
// Spread out: amount ÷ every in each of the `every` months leading up to and including a due month,
// so the money is already set aside when the bill arrives.
function recChargeIn(r, ym){
  if (r.active === false) return 0;
  if (isSpread(r)) return ymIdx(ym) >= ymIdx(r.start) - r.every + 1 ? perMonth(r) : 0;
  return dueIn(r, ym) ? r.amount : 0;
}
function recommendedDaily(finalBudget, days){
  return finalBudget > 0 && days > 0 ? Math.floor(finalBudget / days / 1000) * 1000 : 0;
}
// Daily budget as a timeline: each change applies from its date onward, so past days never change.
// state.dailyLog = [{ from: 'YYYY-MM-DD', daily }] sorted by date. Older data without a log falls back to the month settings.
function dailyAt(st, date){
  const log = st.dailyLog;
  let v = null;
  if (log) for (const e of log){ if (e.from <= date) v = e.daily; else break; }
  return v != null ? v : (settingsFor(st, date.slice(0, 7)).daily || 0);
}
function setDailyFrom(st, from, daily){
  if (!st.dailyLog) st.dailyLog = [];
  if (st.dailyLog.length && dailyAt(st, from) === daily && st.dailyLog.every(e => e.from <= from)) return false;
  st.dailyLog = st.dailyLog.filter(e => e.from < from);
  st.dailyLog.push({ from, daily });
  st.dailyLog.sort((x, y) => x.from < y.from ? -1 : 1);
  return true;
}
// Extra money (state.extra): 'today' lands on its date; 'spread' is shared over the rest of that month,
// with any rupiah left over from dividing added to the first day.
function extraOnDay(e, ym, d){
  if (e.date.slice(0, 7) !== ym) return 0;
  const ed = +e.date.slice(8, 10);
  if (e.mode !== 'spread') return d === ed ? e.amount : 0;
  if (d < ed) return 0;
  const n = daysIn(ym) - ed + 1, per = Math.floor(e.amount / n);
  return per + (d === ed ? e.amount - per * n : 0);
}
// Summary of month `ym` counted through day `upto` (inclusive).
function summary(st, ym, upto){
  const s = settingsFor(st, ym), days = daysIn(ym);
  const startYm = st.start.slice(0, 7), startDay = +st.start.slice(8, 10);
  const firstDay = ym < startYm ? null : (ym === startYm ? startDay : 1);
  const last = Math.min(Math.max(upto, 0), days);
  const accDays = firstDay === null ? 0 : Math.max(0, last - firstDay + 1);
  const trackDays = firstDay === null ? 0 : days - firstDay + 1;
  // Joined mid-month and said how much was left: that amount is the whole budget for the rest of the month,
  // and recurring payments start next month.
  const midStart = ym === startYm && startDay > 1 && st.startLeft != null;
  const recs = midStart ? [] : st.recurring.map(r => ({ r, charge: recChargeIn(r, ym) })).filter(x => x.charge > 0);
  const recTotal = sum(recs.map(x => x.charge));
  const monthly = midStart ? st.startLeft : monthlyOf(s);
  const baseFinal = monthly - recTotal;
  const extras = (st.extra || []).filter(e => e.date.slice(0, 7) === ym);
  const extraTotal = sum(extras.map(e => e.amount));
  const finalBudget = baseFinal + extraTotal;
  // What each day gives you: its daily budget (if tracked) plus any extra money landing on it.
  const dayDaily = [0], dayExtra = [0];
  let plannedTotal = 0;
  for (let d = 1; d <= days; d++){
    const dd = firstDay !== null && d >= firstDay ? dailyAt(st, ym + '-' + pad(d)) : 0;
    dayDaily.push(dd); plannedTotal += dd;
    dayExtra.push(sum(extras.map(e => extraOnDay(e, ym, d))));
  }
  let accrued = 0, extraTo = 0;
  for (let d = 1; d <= last; d++){ accrued += dayDaily[d] + dayExtra[d]; extraTo += dayExtra[d]; }
  const entries = st.spend.filter(e => e.date.slice(0, 7) === ym);
  const spentTo = sum(entries.filter(e => +e.date.slice(8, 10) <= upto).map(e => e.amount));
  const spentMonth = sum(entries.map(e => e.amount));
  const ref = Math.min(Math.max(last, firstDay || 1), days);
  return {
    ym, days, monthly, amount: s.amount, every: s.every || 1, midStart, recs, recTotal,
    daily: dailyAt(st, ym + '-' + pad(ref)), todayExtra: dayExtra[ref] || 0, dayDaily, dayExtra,
    extras, extraTotal, extraTo, baseFinal, finalBudget,
    recommended: recommendedDaily(baseFinal, midStart ? trackDays : days),
    firstDay, accDays, trackDays, accrued, spentTo, spentMonth,
    available: accrued - spentTo,
    leftInMonth: finalBudget - spentMonth,
    plannedTotal,
    overPlan: plannedTotal > baseFinal
  };
}
// Today's money ("pot") = what was left at the start of the day: carried over + today's allowance.
// debt: below zero. danger: less than a third of today's money left, or less than a third of a day's
// budget (so a tiny pot left over from paying back debt still counts as low). safe: everything else.
function moneyState(available, daily, pot){
  if (available < 0) return 'debt';
  const base = Math.max(daily, pot == null ? daily : pot);
  if (available < base / 3) return 'danger';
  return 'safe';
}
function parseAmount(str){
  let v = String(str || '').trim().toLowerCase().replace(/\s/g, '').replace(/^rp\.?/, '');
  let mult = 1;
  if (/(jt|juta|m)$/.test(v)){ mult = 1e6; v = v.replace(/(jt|juta|m)$/, ''); }
  else if (/(k|rb|ribu)$/.test(v)){ mult = 1e3; v = v.replace(/(k|rb|ribu)$/, ''); }
  if (mult > 1){ v = v.replace(',', '.'); const n = parseFloat(v.replace(/[^0-9.]/g, '')); return isFinite(n) ? Math.round(n * mult) : 0; }
  const n = parseInt(v.replace(/[^0-9]/g, ''), 10);
  return isFinite(n) ? n : 0;
}
/*END*/

const nf = new Intl.NumberFormat('id-ID');
const rp = n => (n < 0 ? '−' : '') + 'Rp' + nf.format(Math.abs(Math.round(n)));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const monthName = ym => MONTHS[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
const shortMonth = ym => MONTHS[+ym.slice(5, 7) - 1].slice(0, 3) + ' ' + ym.slice(0, 4);
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
const everyLabel = n => n === 1 ? 'Every month' : n === 12 ? 'Every year' : n % 12 === 0 ? 'Every ' + (n / 12) + ' years' : 'Every ' + n + ' months';

const KEY = 'jatah.v1';
let storageOK = true;
function seed(){
  return { v: 3, start: todayStr(), startLeft: null, months: {}, dailyLog: [], recurring: [], spend: [], extra: [], setupDone: false, seen: [], tab: 'today' };
}
function load(){
  try {
    const s = localStorage.getItem(KEY);
    if (s){
      const o = JSON.parse(s);
      if (o && o.months){
        if (o.setupDone === undefined) o.setupDone = !o.example;  // installs from before the setup screen
        if (!o.seen) o.seen = [];
        if (!o.extra) o.extra = [];
        if (!o.dailyLog){
          // Turn per-month daily budgets into the timeline, starting each month on its 1st (or on the start date).
          o.dailyLog = Object.keys(o.months).sort().map(k => ({ from: k === o.start.slice(0, 7) ? o.start : k + '-01', daily: o.months[k].daily || 0 }));
        }
        return o;
      }
    }
  } catch (e){ storageOK = false; }
  return seed();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; } catch (e){ storageOK = false; } }

let state = load();
let tab = state.tab || 'today';
let histYm = todayStr().slice(0, 7);
let openDay = null;
let enterNext = true;

const $ = s => document.querySelector(s);
const view = $('#view');

function render(){
  const t = todayStr(), d = new Date();
  $('#when').innerHTML = WD[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3) + '<br><span class="num">Day ' + d.getDate() + ' of ' + daysIn(t.slice(0, 7)) + '</span>';
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  ({ today: renderToday, recurring: renderRecurring, history: renderHistory, setup: renderSetup })[tab]();
  view.classList.remove('enter');
  if (enterNext){ void view.offsetWidth; view.classList.add('enter'); enterNext = false; }
  updateBell();
  if (kpTarget && !kpTarget.isConnected) closeKeypad();
}

function renderToday(){
  const t = todayStr(), ym = t.slice(0, 7), day = +t.slice(8, 10);
  const s = summary(state, ym, day);
  const todays = state.spend.filter(e => e.date === t);
  const todaysIn = (state.extra || []).filter(e => e.date === t);
  const spentToday = sum(todays.map(e => e.amount));
  const notStarted = s.accDays === 0;
  const pot = s.available + spentToday;  // today's money before anything was spent today
  const st = notStarted ? 'safe' : moneyState(s.available, s.daily, pot);
  const todayGets = s.daily + s.todayExtra;
  const todayLeft = todayGets - spentToday;
  // Outer ring: share of today's money still left, so it starts each day full. In debt it shows how much of tomorrow is already used.
  const ring = st === 'debt' ? (s.daily > 0 ? Math.min(1, -s.available / s.daily) : 1) : (pot > 0 ? s.available / pot : 0);
  // Inner ring: share of the whole month's budget still left.
  const monthRing = s.leftInMonth < 0 ? 1 : (s.finalBudget > 0 ? s.leftInMonth / s.finalBudget : 0);
  const label = { safe: 'Safe', danger: 'Running low', debt: 'In debt' }[st];
  let sub;
  if (notStarted) sub = 'Tracking starts on ' + state.start + '.';
  else if (st === 'debt') sub = 'You\'re ' + rp(-s.available) + ' over. Tomorrow\'s ' + rp(s.daily) + ' pays it back first, leaving ' + rp(s.available + s.daily) + '.';
  else if (st === 'danger') sub = 'Less than a third of today\'s ' + rp(pot) + ' left. Tomorrow adds ' + rp(s.daily) + '.';
  else sub = rp(s.available) + ' left of today\'s ' + rp(pot) + '. Tomorrow adds ' + rp(s.daily) + '.';
  const items = [...todays.map(itemHtml), ...todaysIn.map(extraHtml)];

  view.innerHTML = `
  <section class="card hero">
    <div class="gauge ${st} ${spinNext ? 'spin' : ''}">
      ${ringSvg(ring, st, monthRing, s.leftInMonth < 0)}
      <div class="center">
        <div class="label">Available today</div>
        <div class="big num" id="bigNum" style="font-size:${bigSize(rp(s.available))}">${rp(s.available)}</div>
        <span class="status"><i></i>${label}</span>
      </div>
    </div>
    <div class="legend">
      <span><i style="background:${st === 'debt' ? 'var(--debt)' : st === 'danger' ? 'var(--danger)' : 'var(--safe)'}"></i>Today</span>
      <span><i style="background:${s.leftInMonth < 0 ? 'var(--debt)' : 'var(--accent)'}"></i>${s.leftInMonth < 0 ? 'Month: ' + rp(-s.leftInMonth) + ' over budget' : 'Month: ' + rp(s.leftInMonth) + ' of ' + rp(s.finalBudget) + ' left'}</span>
    </div>
    <div class="sub">${sub}</div>
  </section>

  <section class="card">
    <h2>Today</h2>
    <div class="rows">
      <div class="row"><span class="k">Today's budget</span><span class="v">${rp(s.daily)}</span></div>
      ${s.todayExtra ? `<div class="row"><span class="k">Extra money today</span><span class="v pos-t">+${rp(s.todayExtra)}</span></div>` : ''}
      <div class="row"><span class="k">Spent today</span><span class="v">${rp(spentToday)}</span></div>
      <div class="row total"><span class="k">Today on its own</span><span class="v ${todayLeft < 0 ? 'neg-t' : 'pos-t'}">${rp(todayLeft)}</span></div>
    </div>
    <div class="list" style="margin-top:8px">
      ${items.length ? items.join('') : '<div class="empty">Nothing spent yet today.</div>'}
    </div>
  </section>

  <section class="card">
    <h2>${monthName(ym)}</h2>
    <div class="rows">
      ${s.midStart
        ? `<div class="row"><span class="k">Left when you started on the ${ord(s.firstDay)}</span><span class="v">${rp(s.monthly)}</span></div>
           <div class="row"><span class="k">Recurring payments</span><span class="v muted">From ${monthOnly(idxYm(ymIdx(ym) + 1))}</span></div>`
        : `<div class="row"><span class="k">Budget for the month${s.every > 1 ? `<br><small>${rp(s.amount)} ÷ ${s.every} months</small>` : ''}</span><span class="v">${rp(s.monthly)}</span></div>
           <div class="row"><span class="k">Recurring payments</span><span class="v">${s.recTotal ? '−' + rp(s.recTotal) : rp(0)}</span></div>`}
      ${s.extraTotal ? `<div class="row"><span class="k">Extra money</span><span class="v pos-t">+${rp(s.extraTotal)}</span></div>` : ''}
      <div class="row total"><span class="k">Final budget for the month</span><span class="v ${s.finalBudget < 0 ? 'neg-t' : ''}">${rp(s.finalBudget)}</span></div>
      <div class="row"><span class="k">Spent so far</span><span class="v">${rp(s.spentMonth)}</span></div>
      <div class="row"><span class="k">Left in the month</span><span class="v ${s.leftInMonth < 0 ? 'neg-t' : 'pos-t'}">${rp(s.leftInMonth)}</span></div>
      <div class="row"><span class="k">Your budget per day</span><span class="v">${rp(s.daily)}</span></div>
      <div class="row"><span class="k">Recommended per day</span><span class="v">${rp(s.recommended)}</span></div>
    </div>
  </section>
  `;
  countUp($('#bigNum'), lastAvail, s.available);
  lastAvail = s.available;
  spinNext = false;
}

// Keep the big number inside the inner ring however long it gets.
function bigSize(text){
  const n = text.length;
  const px = n <= 8 ? 33 : n === 9 ? 30 : n === 10 ? 27 : n === 11 ? 24 : 21;
  return 'min(' + px + 'px, ' + (px / 3.9).toFixed(1) + 'vw)';
}

const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastRing = 0, lastRingM = 0, lastAvail = 0, spinNext = true, countRaf = 0;
function countUp(el, from, to){
  cancelAnimationFrame(countRaf);
  if (!el || from === to || reduceMotion()) return;
  const t0 = performance.now(), dur = 900;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = rp(Math.round((from + (to - from) * e) / 100) * 100);
    if (p < 1) countRaf = requestAnimationFrame(step); else el.textContent = rp(to);
  };
  el.textContent = rp(from);
  countRaf = requestAnimationFrame(step);
}
function ringSvg(v, st, m, mOver){
  const R = 96, C = 2 * Math.PI * R, R2 = 76, C2 = 2 * Math.PI * R2;
  const clamp = x => Math.max(0, Math.min(1, x || 0));
  v = clamp(v); m = clamp(m);
  // Draw at the previous values, then let CSS sweep them to the new ones.
  const svg = `<svg viewBox="0 0 220 220" role="img" aria-label="Today: ${Math.round(v * 100)}% ${st === 'debt' ? 'of tomorrow already used' : 'left'}. Month: ${mOver ? 'over budget' : Math.round(m * 100) + '% left'}.">
    <circle class="track" cx="110" cy="110" r="${R}" fill="none" stroke-width="16"/>
    <circle class="arc" data-c="${C}" data-v="${v}" cx="110" cy="110" r="${R}" fill="none" stroke-width="16"
      stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - lastRing)}"/>
    <circle class="track m" cx="110" cy="110" r="${R2}" fill="none" stroke-width="7"/>
    <circle class="arc m ${mOver ? 'over' : ''}" data-c="${C2}" data-v="${m}" cx="110" cy="110" r="${R2}" fill="none" stroke-width="7"
      stroke-dasharray="${C2}" stroke-dashoffset="${C2 * (1 - lastRingM)}"/>
  </svg>`;
  lastRing = v; lastRingM = m;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('.gauge .arc').forEach(a => a.setAttribute('stroke-dashoffset', String(+a.dataset.c * (1 - +a.dataset.v))));
  }));
  return svg;
}

function renderHistory(){
  const t = todayStr(), curYm = t.slice(0, 7), today = +t.slice(8, 10);
  const ym = histYm, isCur = ym === curYm, isFuture = ym > curYm;
  const days = daysIn(ym);
  const upto = isCur ? today : isFuture ? 0 : days;
  const s = summary(state, ym, upto);
  const minYm = [state.start.slice(0, 7), ...state.spend.map(e => e.date.slice(0, 7))].sort()[0];
  let rows = '';
  if (s.firstDay !== null && upto >= 1){
    let acc = 0, spent = 0;
    const list = [];
    for (let d = 1; d <= upto; d++){
      const ds = ym + '-' + pad(d);
      const tracked = d >= s.firstDay;
      const dayEntries = state.spend.filter(e => e.date === ds);
      const dayIn = (state.extra || []).filter(e => e.date === ds);
      const dsp = sum(dayEntries.map(e => e.amount));
      const give = s.dayDaily[d] + s.dayExtra[d];
      acc += give;
      spent += dsp;
      if (!tracked && !dsp && !s.dayExtra[d]) continue;
      const bal = acc - spent;
      const w = give > 0 ? Math.min(100, dsp / give * 100) : (dsp ? 100 : 0);
      const wd = WD[new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1, d).getDay()];
      list.push(`<div class="day ${isCur && d === today ? 'today' : ''}">
        <button type="button" data-act="toggle-day" data-day="${ds}" aria-expanded="${openDay === ds}">

    <div class="monthnav">
      <button type="button" data-act="hist-prev" aria-label="Previous month" ${ym <= minYm ? 'disabled' : ''}>‹</button>
      <b>${monthName(ym)}</b>

    </div>
    <div class="rows" style="margin-top:10px">
      <div class="row"><span class="k">Final budget</span><span class="v">${rp(s.finalBudget)}</span></div>
      <div class="row"><span class="k">Spent</span><span class="v">${rp(s.spentMonth)}</span></div>
      ${s.extraTotal ? `<div class="row"><span class="k">Extra money</span><span class="v pos-t">+${rp(s.extraTotal)}</span></div>` : ''}
      <div class="row"><span class="k">${isCur ? 'Given to you so far' : 'Given to you in total'}</span><span class="v">${rp(s.accrued)}</span></div>
      <div class="row total"><span class="k">${isCur ? 'Available today' : 'Ended the month at'}</span><span class="v ${stClass(moneyState(s.available, s.daily)) || 'pos-t'}">${rp(s.available)}</span></div>
    </div>
  </section>
  <section class="card">
    <div class="row" style="padding-top:0"><span class="label">Day</span><span class="label">Balance after the day</span></div>
    <div class="days">${rows || '<div class="empty">Nothing tracked in this month.</div>'}</div>

}

/* ---------- notifications ---------- */
const ord = n => n + ((n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'));
const monthOnly = ym => MONTHS[+ym.slice(5, 7) - 1];
function getNotes(){
  const t = todayStr(), ym = t.slice(0, 7), day = +t.slice(8, 10), next = idxYm(ymIdx(ym) + 1);
  const s = summary(state, ym, day);
  const spentToday = sum(state.spend.filter(e => e.date === t).map(e => e.amount));
  const pot = s.available + spentToday;
  const st = s.accDays ? moneyState(s.available, s.daily, pot) : 'safe';
  const out = [];
  if (!storageOK) out.push({ id: 'storage', kind: 'debt', t: 'Your entries aren\'t being saved', b: 'This browser is blocking storage, so everything disappears when you close it. Open the app in your phone\'s browser or install it instead.' });
  if (st === 'debt') out.push({ id: 'debt-' + t, kind: 'debt', t: 'You\'re ' + rp(-s.available) + ' over', b: 'Tomorrow\'s ' + rp(s.daily) + ' pays it back first, leaving ' + rp(s.available + s.daily) + '.' });
  else if (st === 'danger') out.push({ id: 'low-' + t, kind: 'danger', t: 'Running low today', b: rp(s.available) + ' left of today\'s ' + rp(pot) + '.' });
  if (s.overPlan && s.daily > 0) out.push({ id: 'plan-' + ym + '-' + s.daily + '-' + s.finalBudget, kind: 'danger', t: 'Your daily budget is too high',
    b: rp(s.daily) + ' a day adds up to ' + rp(s.plannedTotal) + ' this month, ' + rp(s.plannedTotal - s.finalBudget) + ' more than you have. The recommended amount is ' + rp(s.recommended) + '.',
    action: { label: 'Change it', act: 'go-setup' } });
  // This month's recurring payments, as one note.
  if (!s.midStart && s.recs.length){
    const parts = s.recs.map(x => esc(x.r.name) + ' ' + rp(x.charge) + (isSpread(x.r) ? ' (set aside)' : ''));
    out.push({ id: 'month-' + ym + '-' + s.recTotal, kind: 'info', t: rp(s.recTotal) + ' in recurring payments for ' + monthOnly(ym),
      b: 'Taken from your budget on the 1st: ' + parts.join(', ') + '.' });
  }
  // Longer payments: due this month, or coming up next month.
  for (const r of state.recurring){
    if (r.active === false || r.every === 1) continue;
    if (dueIn(r, ym)) out.push({ id: 'due-' + r.id + '-' + ym, kind: 'info', t: esc(r.name) + ' is due this month',
      b: isSpread(r)
        ? rp(r.amount) + (r.day > 1 ? ', billed on the ' + ord(r.day) : '') + '. You\'ve been setting aside ' + rp(perMonth(r)) + ' a month for it.'
        : rp(r.amount) + ' came out of this month\'s budget on the 1st' + (r.day > 1 ? ' (it bills on the ' + ord(r.day) + ')' : '') + '.' });
    else if (dueIn(r, next)) out.push({ id: 'soon-' + r.id + '-' + next, kind: 'info', t: esc(r.name) + ' is due next month',
      b: rp(r.amount) + ' in ' + monthOnly(next) + '. ' + (isSpread(r) ? 'It\'s covered by what you\'ve set aside.' : 'It will come out of ' + monthOnly(next) + '\'s budget on the 1st.') });
  }
  // Backup reminder every two weeks once there's something worth keeping.
  const dayNo = Math.floor(new Date(t + 'T00:00:00').getTime() / 864e5);
  const lastNo = state.lastBackup ? Math.floor(new Date(state.lastBackup + 'T00:00:00').getTime() / 864e5) : null;
  if (state.spend.length >= 5 && (lastNo === null || dayNo - lastNo >= 14)) out.push({ id: 'backup-' + Math.floor(dayNo / 14), kind: 'info', t: 'Time for a backup',
    b: lastNo === null ? 'You haven\'t made one yet. If this phone loses its data, a backup is the only way to get it back.' : 'Your last one was ' + (dayNo - lastNo) + ' days ago.',
    action: { label: 'Copy backup', act: 'copy-backup' } });
  return out;
}
function unseenNotes(){ const seen = new Set(state.seen || []); return getNotes().filter(n => !seen.has(n.id)); }
const bellBtn = $('#bellBtn'), notePanel = $('#notePanel');
let lastBadge = 0;
function updateBell(){
  const n = unseenNotes().length, badge = $('#bellBadge');
  badge.hidden = n === 0; badge.textContent = n > 9 ? '9+' : String(n);

}

const panelOpen = () => notePanel.classList.contains('open');

/* ---------- first-time setup ---------- */
const obEl = $('#onboard');

const OB_MARK = `<svg viewBox="0 0 120 120" class="ob-mark" aria-hidden="true">

function obCtx(){
  const t = todayStr(), ym = t.slice(0, 7), day = +t.slice(8, 10), next = idxYm(ymIdx(ym) + 1);
  // The start question only makes sense in your first month. Going through setup again later keeps your history as it is.

  const askStart = firstMonth && day > 1;

}
function obSteps(){ return obCtx().askStart ? ['welcome', 'budget', 'recurring', 'start', 'daily'] : ['welcome', 'budget', 'recurring', 'daily']; }
function obTemp(c){
  return { ...state, start: c.midd ? c.t : (c.firstMonth ? c.ym + '-01' : state.start), startLeft: c.midd ? (ob.left || 0) : null,
    months: { [c.ym]: { amount: ob.amount, every: ob.every, daily: 0 } } };

  state.months[c.ym] = { amount: ob.amount || 0, every: ob.every, daily: ob.dailyNow || 0 };
  if (c.midd) state.months[c.next] = { amount: ob.amount || 0, every: ob.every, daily: ob.dailyNext || 0 };
  setDailyFrom(state, c.firstMonth ? state.start : c.t, ob.dailyNow || 0);
  if (c.midd) setDailyFrom(state, c.next + '-01', ob.dailyNext || 0);
  const again = state.setupDone;
  state.setupDone = true; state.example = false; save();
  closeOnboard();
  tab = 'today'; state.tab = tab; enterNext = true; spinNext = true; lastAvail = 0; lastRing = 0; render();
  toast(again ? 'Budget updated' : 'All set. Happy budgeting!');
}

/* ---------- number keypad for money fields ---------- */
// Money fields are read-only so the phone keyboard never opens; this keypad fills them in instead.
const keypad = $('#keypad');
let kpTarget = null;
function kpSet(digits){
  digits = String(digits).replace(/\D/g, '').replace(/^0+/, '').slice(0, 12);
  kpTarget.value = digits ? nf.format(+digits) : '';
  kpTarget.dispatchEvent(new Event('input', { bubbles: true }));
}
function openKeypad(input){
  if (kpTarget === input && keypad.classList.contains('open')) return;
  document.querySelectorAll('.money.active').forEach(m => m.classList.remove('active'));
  kpTarget = input;
  const wrap = input.closest('.money'); if (wrap) wrap.classList.add('active');
  const lab = document.querySelector('label[for="' + input.id + '"]');
  $('#kpLabel').textContent = lab ? lab.textContent : 'Amount';
  keypad.classList.add('open'); keypad.setAttribute('aria-hidden', 'false');
  setKb(keypad.offsetHeight);
}
function closeKeypad(){
  if (!kpTarget && !keypad.classList.contains('open')) return;
  document.querySelectorAll('.money.active').forEach(m => m.classList.remove('active'));
  kpTarget = null; keypad.classList.remove('open'); keypad.setAttribute('aria-hidden', 'true');
  setKb(0);
}
// Keep focus on the field while tapping keys.
keypad.addEventListener('pointerdown', e => { if (e.target.closest('button')) e.preventDefault(); });
keypad.addEventListener('mousedown', e => e.preventDefault());
keypad.addEventListener('click', e => {
  const k = e.target.closest('[data-key]'); if (!k || !kpTarget) return;
  const key = k.dataset.key, digits = kpTarget.value.replace(/\D/g, '');
  if (key === 'done'){ const t = kpTarget; closeKeypad(); t.blur(); return; }
  if (key === 'del') kpSet(digits.slice(0, -1));
  else if (key === '000'){ if (digits) kpSet(digits + '000'); }
  else kpSet(digits + key);
});
document.addEventListener('focusin', e => {
  if (e.target.matches && e.target.matches('[data-money]')) openKeypad(e.target);
  else if (kpTarget && !(e.target.closest && e.target.closest('#keypad'))) closeKeypad();
});
document.addEventListener('click', e => {
  if (e.target.closest('[data-money]')) return openKeypad(e.target.closest('[data-money]'));
  if (kpTarget && !e.target.closest('#keypad, .money, [data-add]')) closeKeypad();
});
// A real keyboard (on a computer) still works.
document.addEventListener('keydown', e => {
  if (!e.target.matches || !e.target.matches('[data-money]')) return;
  if (kpTarget !== e.target) openKeypad(e.target);
  const digits = e.target.value.replace(/\D/g, '');
  if (/^[0-9]$/.test(e.key)){ e.preventDefault(); kpSet(digits + e.key); }
  else if (e.key === 'Backspace'){ e.preventDefault(); kpSet(digits.slice(0, -1)); }
});

/* ---------- recent changes (undo) ---------- */
// Before each change, a copy of everything is kept on this phone (last 20), so any change can be undone.
const HKEY = 'jatah.history';
function loadHist(){ try { return JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch (e){ return []; } }
function checkpoint(label){
  try {
    const snap = { ...state }; delete snap.tab;
    const h = loadHist();
    h.unshift({ t: Date.now(), label, data: JSON.stringify(snap) });
    localStorage.setItem(HKEY, JSON.stringify(h.slice(0, 20)));
  } catch (e){}
}
function whenText(ms){
  const d = new Date(ms), now = new Date(), hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  const dayStart = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((dayStart(now) - dayStart(d)) / 864e5);
  return diff === 0 ? 'Today, ' + hm : diff === 1 ? 'Yesterday, ' + hm : d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3) + ', ' + hm;
}
function recentChangesCard(){
  const hist = loadHist();
  return `<section class="card" style="margin-top:12px">
    <h2>Recent changes</h2>
    <p class="muted small" style="margin:0 0 4px">Made a mistake? Undo takes Jatah. back to how it was right before that change.</p>
    <div class="list">${hist.length ? hist.map((h, i) => `<div class="item"><div class="main"><div class="t">${esc(h.label)}</div><div class="s">${whenText(h.t)}</div></div>
      <button type="button" class="btn ghost sm" data-act="undo-to" data-i="${i}">Undo</button></div>`).join('')
      : '<div class="empty">Nothing yet. Changes you make will show up here.</div>'}</div>
  </section>`;
}
function openUndo(i){
  const h = loadHist()[i]; if (!h) return;
  openSheet(`<h3 id="sheetTitle">Undo this change?</h3>
  <p style="margin:0 0 8px">Jatah. goes back to how it was right before <b>${esc(h.label)}</b> (${whenText(h.t)}).</p>
  <p class="muted small" style="margin:0 0 14px">${i > 0 ? 'The ' + i + ' newer ' + (i > 1 ? 'changes' : 'change') + ' above it will be undone too. ' : ''}Changed your mind? This undo shows up in the list too, so you can undo it.</p>
  <div class="two"><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="button" class="btn" data-act="undo-yes" data-i="${i}">Undo</button></div>`);
}
function restoreCheckpoint(i){
  const c = loadHist()[i]; if (!c) return;
  checkpoint('Undid: ' + c.label);
  const data = JSON.parse(c.data);
  state = { ...data, tab: state.tab, seen: state.seen || [] };
  save(); closeSheet(); enterNext = true; spinNext = true; render();
  toast('Back to before: ' + c.label);
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  if (panelOpen() && !e.target.closest('#notePanel, #bellBtn')) closePanel();
  if (e.target.closest('#bellBtn')){ panelOpen() ? closePanel() : openPanel(); return; }
  const b = e.target.closest('[data-act],[data-tab]');
  if (!b) return;
  if (b.dataset.fromPanel) closePanel();
  if (b.dataset.tab){ if (b.dataset.tab !== tab){ enterNext = true; spinNext = true; } tab = b.dataset.tab; state.tab = tab; save(); openDay = null; window.scrollTo(0, 0); render(); return; }
  const act = b.dataset.act, id = b.dataset.id;
  switch (act){
    case 'close': closeSheet(); break;
    case 'dismiss-example': state.example = false; save(); render(); break;
    case 'del-spend': {
      const i = state.spend.findIndex(x => x.id === id); if (i < 0) break;
      checkpoint('Deleted ' + rp(state.spend[i].amount) + ' spending' + (state.spend[i].note ? ' (' + state.spend[i].note + ')' : ''));
      const [gone] = state.spend.splice(i, 1); save(); render();
      toast('Deleted ' + rp(gone.amount), () => { state.spend.push(gone); save(); render(); });
      break;
    }
    case 'del-extra': {
      const i = state.extra.findIndex(x => x.id === id); if (i < 0) break;
      checkpoint('Deleted ' + rp(state.extra[i].amount) + ' money in' + (state.extra[i].note ? ' (' + state.extra[i].note + ')' : ''));
      const [gone] = state.extra.splice(i, 1); save(); render();
      toast('Deleted ' + rp(gone.amount), () => { state.extra.push(gone); save(); render(); });
      break;
    }
    case 'add-kind': {
      const dEl = $('#spDate') || $('#inDate');
      openAddSpend(dEl ? dEl.value : null, b.dataset.kind);
      break;
    }
    case 'undo-to': openUndo(+b.dataset.i); break;
    case 'undo-yes': restoreCheckpoint(+b.dataset.i); break;
    case 'add-rec': openRec(); break;
    case 'ob-preset': openRec(null, REC_PRESETS[+b.dataset.i]); break;
    case 'rec-preset': {
      // Fill the open sheet, then move on to the amount.
      const pr = REC_PRESETS[+b.dataset.i];
      $('#rName').value = pr.name;
      const ev = $('#rEvery'); ev.value = pr.every; ev.dispatchEvent(new Event('input'));
      b.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
      $('#rAmt').focus();
      break;
    }
    case 'edit-rec': openRec(id); break;
    case 'del-rec': {
      const i = state.recurring.findIndex(x => x.id === id); if (i < 0) break;
      checkpoint('Deleted ' + state.recurring[i].name);
      const [gone] = state.recurring.splice(i, 1); save(); closeSheet(); render(); renderOnboard();
      toast('Deleted ' + gone.name, () => { state.recurring.push(gone); save(); render(); renderOnboard(); });
      break;
    }
    case 'hist-prev': enterNext = true; histYm = idxYm(ymIdx(histYm) - 1); openDay = null; render(); break;
    case 'hist-next': enterNext = true; histYm = idxYm(ymIdx(histYm) + 1); openDay = null; render(); break;
    case 'toggle-day': openDay = openDay === b.dataset.day ? null : b.dataset.day; render(); break;
    case 'add-on': openAddSpend(b.dataset.day); break;
    case 'use-rec': { const f = $('#fDailyNext') || $('#fDaily'); f.value = nf.format(+b.dataset.v); f.dispatchEvent(new Event('input')); break; }
    case 'set-every': $('#fEvery').value = b.dataset.n; setupUpdateRec && setupUpdateRec(); break;
    case 'redo-setup': openOnboard(); break;
    case 'go-setup': enterNext = true; tab = 'setup'; state.tab = tab; save(); window.scrollTo(0, 0); render(); break;
    case 'close-panel': closePanel(); break;
    case 'ob-next': obNext(); break;
    case 'ob-back': ob.i = Math.max(0, ob.i - 1); ob.dir = -1; renderOnboard(); break;
    case 'ob-every': ob.every = +b.dataset.n; $('#obEvery').value = ob.every; ob.dailyNow = ob.dailyNext = null; syncObEvery(); break;
    case 'ob-mode': ob.mode = b.dataset.mode; ob.dailyNow = ob.dailyNext = null; renderOnboard(); if (ob.mode === 'today') setTimeout(() => { const l = $('#obLeft'); l && l.focus(); }, 50); break;
    case 'ob-finish': obFinish(); break;
    case 'copy-backup': {
      const text = JSON.stringify(state);
      try { await navigator.clipboard.writeText(text); state.lastBackup = todayStr(); save(); updateBell(); toast('Backup copied. Paste it into your notes.'); }
      catch (err){ openBackup(text); }
      break;
    }
    case 'import': openImport(); break;
    case 'erase': openErase(); break;
    case 'erase-yes': checkpoint('Erased everything'); state = seed(); save(); closeSheet(); tab = 'today'; render(); openOnboard(); break;
  }
});
$('#addBtn').addEventListener('click', () => openAddSpend(tab === 'history' && openDay ? openDay : null));

// Android back button (only inside the APK): close a sheet, then go back to Today, then leave the app.
try {
  const capApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (capApp) capApp.addListener('backButton', () => {
    if (sheetBg.classList.contains('open')) closeSheet();
    else if (panelOpen()) closePanel();
    else if (ob && ob.i > 0){ ob.i--; ob.dir = -1; renderOnboard(); }
    else if (ob) capApp.exitApp();
    else if (tab !== 'today'){ enterNext = true; spinNext = true; tab = 'today'; state.tab = tab; save(); render(); }
    else capApp.exitApp();
  });
} catch (e){}

// On-screen keyboard. Newer Android versions draw the keyboard over the app instead of shrinking it,
// so anything pinned to the bottom (sheets, setup buttons) would hide behind it. Measure how much of the
// screen the keyboard covers and expose it as --kb; the CSS lifts things by that much.
const kbRoot = document.documentElement;
let kbBase = window.innerHeight;
function setKb(px){
  px = Math.max(0, Math.round(px || 0));
  const open = px > 80;
  kbRoot.style.setProperty('--kb', (open ? px : 0) + 'px');
  kbRoot.classList.toggle('kb-open', open);
  if (open){
    const el = document.activeElement;
    if (el && el.matches('input, textarea, select')) setTimeout(() => el.scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' }), 60);
  }
}
try {
  const capKb = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Keyboard;
  if (capKb){
    // Inside the APK. If Android did shrink the app after all, only lift by what's still covered.
    capKb.addListener('keyboardDidShow', info => setKb(info.keyboardHeight - (kbBase - window.innerHeight)));
    capKb.addListener('keyboardWillHide', () => setKb(0));
  } else if (window.visualViewport){
    // In a browser or installed web app: the visible area shrinks while the page behind it doesn't.
    const vv = window.visualViewport;
    const update = () => setKb(window.innerHeight - vv.height - vv.offsetTop);
    vv.addEventListener('resize', update);
    vv.addEventListener('scroll', update);
  }
  window.addEventListener('orientationchange', () => setTimeout(() => { if (!kbRoot.classList.contains('kb-open')) kbBase = window.innerHeight; }, 400));
} catch (e){}

// Offline support when installed from the website (not needed inside the APK).
if ('serviceWorker' in navigator && !window.Capacitor && location.protocol === 'https:'){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

// Re-render when the app comes back to the front, so a new day starts on its own.
let lastDay = todayStr();
document.addEventListener('visibilitychange', () => { if (!document.hidden && todayStr() !== lastDay){ lastDay = todayStr(); histYm = lastDay.slice(0, 7); render(); } });
setInterval(() => { if (todayStr() !== lastDay){ lastDay = todayStr(); render(); } }, 60000);

save();
render();
if (!state.setupDone) openOnboard();
else {
  const fresh = unseenNotes();
  if (fresh.length) setTimeout(() => toast(fresh[0].t.replace(/&amp;/g, '&') + (fresh.length > 1 ? ' (+' + (fresh.length - 1) + ' more)' : ''), openPanel, 'View'), 900);
}
</script>
