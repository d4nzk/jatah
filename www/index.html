<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EFE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1814" media="(prefers-color-scheme: dark)">
<meta name="description" content="Jatah. A daily allowance budget tracker that keeps everything on your phone.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jatah.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Jatah.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-thumb phone app. Big "available today" number on top, everything else in quiet cards, tab bar at the bottom. */
/* Palette: pastel latte browns for the app itself; three pastel states for money.
   safe = green, danger (running low) = orange, debt (below zero) = red.
   Each state has a fill (rings, dots), a soft tint (backgrounds) and an -ink shade dark enough for text. */
:root{
  --bg:#F6EFE7; --surface:#FFFBF6; --ink:#4A3B30; --muted:#8A7766; --line:#EBDFD2;
  --accent:#B08968; --accent-ink:#FFFFFF; --accent-soft:#F1E5D8; --accent-text:#8A6444;
  --safe:#93C5A0; --safe-soft:#E4F2E7; --safe-ink:#4C8A5D;
  --danger:#F3B37C; --danger-soft:#FDEBD9; --danger-ink:#B4692B;
  --debt:#EC9590; --debt-soft:#FBE1DF; --debt-ink:#B54C47;
  --shadow:rgba(110,80,55,.14);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1814; --surface:#28211C; --ink:#F2E7DB; --muted:#B19F8E; --line:#3B3129;
    --accent:#CBA383; --accent-ink:#2A1F17; --accent-soft:#3A2E25; --accent-text:#DDBB9C;
    --safe:#94C9A1; --safe-soft:#25332A; --safe-ink:#A9D9B5;
    --danger:#F2B784; --danger-soft:#3D2E20; --danger-ink:#F6C79D;
    --debt:#EE9C97; --debt-soft:#402624; --debt-ink:#F4B1AC;
    --shadow:rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1814; --surface:#28211C; --ink:#F2E7DB; --muted:#B19F8E; --line:#3B3129;
  --accent:#CBA383; --accent-ink:#2A1F17; --accent-soft:#3A2E25; --accent-text:#DDBB9C;
  --safe:#94C9A1; --safe-soft:#25332A; --safe-ink:#A9D9B5;
  --danger:#F2B784; --danger-soft:#3D2E20; --danger-ink:#F6C79D;
  --debt:#EE9C97; --debt-soft:#402624; --debt-ink:#F4B1AC;
  --shadow:rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 112px)}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:4px 2px 14px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--accent-text)}
.when{color:var(--muted);font-size:13px;text-align:right}
main{display:flex;flex-direction:column;gap:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{font-family:var(--display);font-weight:600;font-size:16px;margin:0 0 10px;text-wrap:balance}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.hero{padding:18px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.gauge{position:relative;width:min(260px, 72vw);aspect-ratio:1}
.gauge svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
/* The gauge takes its colours from its state class: safe / danger / debt. */
.gauge{--fill:var(--safe);--soft:var(--safe-soft);--text:var(--ink)}
.gauge.danger{--fill:var(--danger);--soft:var(--danger-soft);--text:var(--danger-ink)}
.gauge.debt{--fill:var(--debt);--soft:var(--debt-soft);--text:var(--debt-ink)}
.gauge .track{stroke:var(--soft);transition:stroke .4s}
.gauge .arc{stroke:var(--fill);stroke-linecap:round;transition:stroke .4s}
.gauge .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 14%}
.gauge .big{font-family:var(--display);font-weight:800;line-height:1.05;letter-spacing:-.03em;margin:4px 0 8px;white-space:nowrap;color:var(--text);transition:color .4s}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--text)}
.gauge .status{background:var(--soft)}
.gauge.safe .status{color:var(--safe-ink)}
.status i{width:8px;height:8px;border-radius:99px;background:var(--fill)}
.hero .sub{font-size:13.5px;color:var(--muted);text-align:center;max-width:34ch;text-wrap:balance}

/* Motion. Everything below is skipped for people who turned animations off. */
@media (prefers-reduced-motion: no-preference){
  .gauge .arc{transition:stroke-dashoffset 1s cubic-bezier(.22,1,.36,1), stroke .4s}
  .gauge.spin svg{animation:spin 1.1s cubic-bezier(.22,1,.36,1)}
  @keyframes spin{from{transform:rotate(-450deg)}to{transform:rotate(-90deg)}}
  .gauge.spin .center{animation:pop .6s .25s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  .gauge.debt .status i, .gauge.danger .status i{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.5);opacity:.5}}

  main.enter > *{animation:rise .5s cubic-bezier(.22,1,.36,1) both}
  main.enter > *:nth-child(2){animation-delay:.06s}
  main.enter > *:nth-child(3){animation-delay:.12s}
  main.enter > *:nth-child(4){animation-delay:.18s}
  main.enter > *:nth-child(n+5){animation-delay:.24s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .item.new{animation:slidein .45s cubic-bezier(.22,1,.36,1) both}
  @keyframes slidein{from{opacity:0;transform:translateX(-12px);background:var(--accent-soft)}to{opacity:1;transform:none}}
  .day .detail{animation:rise .3s ease-out both}

  nav.tabs button svg{transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
  nav.tabs button[aria-current="page"] svg{transform:translateY(-2px) scale(1.1)}
  nav.tabs .add .plus{transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
  nav.tabs .add .plus svg{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
  nav.tabs .add:hover .plus svg, nav.tabs .add:active .plus svg{transform:rotate(90deg)}
  .btn, .chip, .x{transition:transform .15s, background .2s}
  .btn:active, .chip:active{transform:scale(.96)}
  .sheet-bg.open{animation:fade .2s ease-out}
  @keyframes fade{from{opacity:0}}
}

.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted)}
.row .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.row.total{border-top:1px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:10px}
.row.total .k{color:var(--ink);font-weight:600}
.neg-t{color:var(--debt-ink)} .pos-t{color:var(--safe-ink)} .warn-t{color:var(--danger-ink)}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent-text)}
.pill.bad{background:var(--debt-soft);color:var(--debt-ink)}
.pill.warn{background:var(--danger-soft);color:var(--danger-ink)}
.note{border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--danger-soft);color:var(--danger-ink)}
.note.info{background:var(--accent-soft);color:var(--accent-text)}
.note button{margin-left:auto;background:none;border:0;font-weight:700;color:inherit;padding:0 4px}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:12.5px;color:var(--muted)}
.item .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:18px;line-height:1}
.x:hover{background:var(--bg);color:var(--debt-ink)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent-text);border:1px solid var(--line)}
.btn.danger{background:var(--debt-ink);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);
  border-radius:22px 22px 0 0;box-shadow:0 -6px 24px var(--shadow);
  padding:8px 8px calc(env(safe-area-inset-bottom) + 8px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;gap:2px}
nav.tabs button{border:0;background:none;padding:6px 2px;border-radius:12px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{color:var(--accent-text)}
nav.tabs .add{color:var(--accent-text);font-weight:700;padding-top:0}
nav.tabs .add .plus{width:64px;height:64px;margin-top:-34px;border-radius:99px;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;border:5px solid var(--surface);box-shadow:0 8px 18px var(--shadow)}
nav.tabs .add .plus svg{width:28px;height:28px}
nav.tabs .add:active .plus{transform:scale(.94)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12.5px;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:16px}
.inp.big{font-family:var(--display);font-size:28px;font-weight:600;padding:10px 14px}
.form{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:92%;overflow:auto}
.sheet h3{font-family:var(--display);font-size:20px;margin:0 0 14px}
.grip{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav b{font-family:var(--display);font-size:18px}
.monthnav button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.monthnav button:disabled{opacity:.35}

.days{display:flex;flex-direction:column}
.day{border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day > button{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;border:0;background:none;padding:10px 0;text-align:left}
.day .d{font-weight:700}
.day .d small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.day .sp{font-size:13px;color:var(--muted)}
.day .bal{font-weight:700;font-variant-numeric:tabular-nums}
.day .detail{padding:0 0 10px 62px}
.day.today > button .d{color:var(--accent-text)}
.bar{height:4px;border-radius:9px;background:var(--line);margin-top:5px;overflow:hidden;max-width:180px}
.bar i{display:block;height:100%;background:var(--safe)}
.bar i.over{background:var(--debt)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);z-index:30;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;font-size:14px;max-width:calc(100% - 32px);
  box-shadow:0 8px 24px var(--shadow);
  opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%, 12px) scale(.96);
  transition:opacity .25s ease, transform .25s ease, visibility 0s linear .25s}
.toast.show{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%, 0) scale(1);
  transition:opacity .25s ease, transform .35s cubic-bezier(.34,1.56,.64,1), visibility 0s}
@media (prefers-reduced-motion: reduce){ .toast, .toast.show{transform:translate(-50%, 0)} }
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:700}
textarea.inp{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:110px}
.muted{color:var(--muted)}
.small{font-size:13px}
@media (prefers-reduced-motion: no-preference){
  .sheet-bg.open .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Jatah<span>.</span></div>
    <div class="when" id="when"></div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button type="button" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Today</button>
    <button type="button" data-tab="recurring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg>Recurring</button>
    <button type="button" class="add" id="addBtn" aria-label="Add spending"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Add</button>
    <button type="button" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>History</button>
    <button type="button" data-tab="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Setup</button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button type="button" id="toastBtn">Undo</button></div>

<script>
/*LOGIC*/
const pad = n => String(n).padStart(2, '0');
const sum = a => a.reduce((t, x) => t + x, 0);
function ymIdx(ym){ const [y, m] = ym.split('-').map(Number); return y * 12 + (m - 1); }
function idxYm(i){ return Math.floor(i / 12) + '-' + pad(i % 12 + 1); }
function daysIn(ym){ const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }

function settingsFor(st, ym){
  if (st.months[ym]) return st.months[ym];
  const keys = Object.keys(st.months).sort();
  let best = null;
  for (const k of keys) if (k <= ym) best = k;
  if (!best) best = keys[0];
  return best ? st.months[best] : { monthly: 0, daily: 0 };
}
function dueIn(r, ym){
  if (r.active === false) return false;
  const d = ymIdx(ym) - ymIdx(r.start);
  return d >= 0 && d % r.every === 0;
}
function nextDueAfter(r, ym){ // first due month strictly after ym
  const s = ymIdx(r.start), from = ymIdx(ym) + 1;
  if (from <= s) return r.start;
  const k = Math.ceil((from - s) / r.every) * r.every;
  return idxYm(s + k);
}
function recommendedDaily(finalBudget, days){
  return finalBudget > 0 ? Math.floor(finalBudget / days / 1000) * 1000 : 0;
}
// Summary of month `ym` counted through day `upto` (inclusive).
function summary(st, ym, upto){
  const s = settingsFor(st, ym), days = daysIn(ym);
  const recs = st.recurring.filter(r => dueIn(r, ym));
  const recTotal = sum(recs.map(r => r.amount));
  const finalBudget = s.monthly - recTotal;
  const startYm = st.start.slice(0, 7), startDay = +st.start.slice(8, 10);
  const firstDay = ym < startYm ? null : (ym === startYm ? startDay : 1);
  const accDays = firstDay === null ? 0 : Math.max(0, Math.min(upto, days) - firstDay + 1);
  const trackDays = firstDay === null ? 0 : days - firstDay + 1;
  const entries = st.spend.filter(e => e.date.slice(0, 7) === ym);
  const spentTo = sum(entries.filter(e => +e.date.slice(8, 10) <= upto).map(e => e.amount));
  const spentMonth = sum(entries.map(e => e.amount));
  const accrued = s.daily * accDays;
  return {
    ym, days, monthly: s.monthly, daily: s.daily, recs, recTotal, finalBudget,
    recommended: recommendedDaily(finalBudget, days),
    firstDay, accDays, trackDays, accrued, spentTo, spentMonth,
    available: accrued - spentTo,
    leftInMonth: finalBudget - spentMonth,
    plannedTotal: s.daily * trackDays,
    overPlan: s.daily * trackDays > finalBudget
  };
}
// safe: fine. danger: less than half a day's budget left. debt: below zero.
function moneyState(available, daily){
  if (available < 0) return 'debt';
  if (available < daily * 0.5) return 'danger';
  return 'safe';
}
function parseAmount(str){
  let v = String(str || '').trim().toLowerCase().replace(/\s/g, '').replace(/^rp\.?/, '');
  let mult = 1;
  if (/(jt|juta|m)$/.test(v)){ mult = 1e6; v = v.replace(/(jt|juta|m)$/, ''); }
  else if (/(k|rb|ribu)$/.test(v)){ mult = 1e3; v = v.replace(/(k|rb|ribu)$/, ''); }
  if (mult > 1){ v = v.replace(',', '.'); const n = parseFloat(v.replace(/[^0-9.]/g, '')); return isFinite(n) ? Math.round(n * mult) : 0; }
  const n = parseInt(v.replace(/[^0-9]/g, ''), 10);
  return isFinite(n) ? n : 0;
}
/*END*/

const nf = new Intl.NumberFormat('id-ID');
const rp = n => (n < 0 ? '−' : '') + 'Rp' + nf.format(Math.abs(Math.round(n)));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const monthName = ym => MONTHS[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
const shortMonth = ym => MONTHS[+ym.slice(5, 7) - 1].slice(0, 3) + ' ' + ym.slice(0, 4);
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
const everyLabel = n => n === 1 ? 'Every month' : n === 12 ? 'Every year' : n % 12 === 0 ? 'Every ' + (n / 12) + ' years' : 'Every ' + n + ' months';

const KEY = 'jatah.v1';
let storageOK = true;
function seed(){
  const t = todayStr(), ym = t.slice(0, 7);
  return { v: 1, start: t, months: { [ym]: { monthly: 1000000, daily: 15000 } },

  catch (e){ storageOK = false; }
  return seed();
}

// Keep the big number inside the ring however long it gets.
function bigSize(text){
  const n = text.length;
  const px = n <= 8 ? 38 : n === 9 ? 34 : n === 10 ? 30 : n === 11 ? 27 : 23;
  return 'min(' + px + 'px, ' + (px / 3.9).toFixed(1) + 'vw)';
}

const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastRing = 0, lastAvail = 0, spinNext = true, countRaf = 0;
function countUp(el, from, to){
  cancelAnimationFrame(countRaf);
  if (!el || from === to || reduceMotion()) return;
  const t0 = performance.now(), dur = 900;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = rp(Math.round((from + (to - from) * e) / 100) * 100);
    if (p < 1) countRaf = requestAnimationFrame(step); else el.textContent = rp(to);
  };
  el.textContent = rp(from);
  countRaf = requestAnimationFrame(step);
}
function ringSvg(v, st){
  const R = 96, C = 2 * Math.PI * R;
  v = Math.max(0, Math.min(1, v || 0));
  // Draw at the previous value, then let CSS sweep it to the new one.
  const svg = `<svg viewBox="0 0 220 220" role="img" aria-label="${Math.round(v * 100)}% ${st === 'debt' ? 'of tomorrow already used' : 'of built-up budget left'}">
    <circle class="track" cx="110" cy="110" r="${R}" fill="none" stroke-width="18"/>
    <circle class="arc" data-c="${C}" data-v="${v}" cx="110" cy="110" r="${R}" fill="none" stroke-width="18"
      stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - lastRing)}"/>
  </svg>`;
  lastRing = v;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('.gauge .arc').forEach(a => a.setAttribute('stroke-dashoffset', String(+a.dataset.c * (1 - +a.dataset.v))));
  }));
  return svg;
}

const stClass = st => st === 'debt' ? 'neg-t' : st === 'danger' ? 'warn-t' : '';
let newId = null;
function itemHtml(e){
  return `<div class="item ${e.id === newId ? 'new' : ''}"><div class="main"><div class="t">${esc(e.note || 'Spending')}</div></div>

function renderHistory(){
  const t = todayStr(), curYm = t.slice(0, 7), today = +t.slice(8, 10);
  const ym = histYm, isCur = ym === curYm, isFuture = ym > curYm;
  const days = daysIn(ym);
  const upto = isCur ? today : isFuture ? 0 : days;
  const s = summary(state, ym, upto);
  const minYm = [state.start.slice(0, 7), ...state.spend.map(e => e.date.slice(0, 7))].sort()[0];
  let rows = '';
  if (s.firstDay !== null && upto >= 1){
    let acc = 0, spent = 0;
    const list = [];
    for (let d = 1; d <= upto; d++){
      const ds = ym + '-' + pad(d);
      const tracked = d >= s.firstDay;
      const dayEntries = state.spend.filter(e => e.date === ds);
      const dsp = sum(dayEntries.map(e => e.amount));
      if (tracked) acc += s.daily;
      spent += dsp;
      if (!tracked && !dsp) continue;
      const bal = acc - spent;
      const w = s.daily > 0 ? Math.min(100, dsp / s.daily * 100) : (dsp ? 100 : 0);
      const wd = WD[new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1, d).getDay()];
      list.push(`<div class="day ${isCur && d === today ? 'today' : ''}">
        <button type="button" data-act="toggle-day" data-day="${ds}" aria-expanded="${openDay === ds}">
          <span class="d num">${d}<small>${wd}</small></span>
          <span><span class="sp num">${dsp ? 'Spent ' + rp(dsp) : 'No spending'}${tracked ? '' : ' · before tracking'}</span><span class="bar"><i class="${dsp > s.daily ? 'over' : ''}" style="width:${w}%"></i></span></span>
          <span class="bal ${stClass(moneyState(bal, s.daily))}">${rp(bal)}</span>
        </button>
        ${openDay === ds ? `<div class="detail">${dayEntries.length ? dayEntries.map(itemHtml).join('') : '<div class="empty">Nothing recorded.</div>'}
          <button type="button" class="btn ghost sm" data-act="add-on" data-day="${ds}">+ Add to this day</button></div>` : ''}
      </div>`);
    }
    rows = list.reverse().join('');
  }
  view.innerHTML = storageNote() + `
  <section class="card">
    <div class="monthnav">
      <button type="button" data-act="hist-prev" aria-label="Previous month" ${ym <= minYm ? 'disabled' : ''}>‹</button>
      <b>${monthName(ym)}</b>
      <button type="button" data-act="hist-next" aria-label="Next month" ${ym >= curYm ? 'disabled' : ''}>›</button>
    </div>
    <div class="rows" style="margin-top:10px">
      <div class="row"><span class="k">Final budget</span><span class="v">${rp(s.finalBudget)}</span></div>
      <div class="row"><span class="k">Spent</span><span class="v">${rp(s.spentMonth)}</span></div>
      <div class="row"><span class="k">${isCur ? 'Daily budget to date' : 'Daily budget total'}</span><span class="v">${rp(s.accrued)}</span></div>
      <div class="row total"><span class="k">${isCur ? 'Available today' : 'Ended the month at'}</span><span class="v ${stClass(moneyState(s.available, s.daily)) || 'pos-t'}">${rp(s.available)}</span></div>
    </div>
  </section>
  <section class="card">
    <div class="row" style="padding-top:0"><span class="label">Day</span><span class="label">Balance after the day</span></div>
    <div class="days">${rows || '<div class="empty">Nothing tracked in this month.</div>'}</div>
  </section>`;
}

        if (!o || typeof o.months !== 'object' || !Array.isArray(o.spend) || !Array.isArray(o.recurring) || !o.start) throw 0;
        state = o; state.example = false; save(); closeSheet(); tab = 'today'; render(); toast('Backup restored');
      } catch (err){ $('#impErr').textContent = 'That doesn\'t look like a Jatah backup. Copy the whole text from "Copy backup", including the curly braces.'; }
    });
  });
}

function openErase(){
  openSheet(`<h3 id="sheetTitle">Erase everything?</h3>
  <p class="muted" style="margin:0 0 14px">All spending, recurring payments and budgets on this phone will be deleted. Copy a backup first if you might want them later.</p>
  <div class="two"><button type="button" class="btn ghost" data-act="close">Keep my data</button><button type="button" class="btn danger" data-act="erase-yes">Erase</button></div>`);
}

function openBackup(text){
  openSheet(`<h3 id="sheetTitle">Your backup</h3>
  <p class="muted small" style="margin:0 0 10px">Copying was blocked here, so select this text and copy it into your notes.</p>
  <textarea class="inp" readonly id="bk">${esc(text)}</textarea>
  <button type="button" class="btn block" style="margin-top:12px" data-act="close">Done</button>`, () => { const b = $('#bk'); b.focus(); b.select(); });
}

/* ---------- toast ---------- */
let toastTimer = null, undoFn = null;
function toast(msg, undo){
  $('#toastMsg').textContent = msg; undoFn = undo || null;
  $('#toastBtn').style.display = undo ? '' : 'none';
  const el = $('#toast');
  if (el.classList.contains('show')){ el.classList.remove('show'); void el.offsetWidth; }
  el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').classList.remove('show'), undo ? 5000 : 1800);
}
$('#toastBtn').addEventListener('click', () => { if (undoFn) undoFn(); $('#toast').classList.remove('show'); });

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act],[data-tab]');
  if (!b) return;
  if (b.dataset.tab){ if (b.dataset.tab !== tab){ enterNext = true; spinNext = true; } tab = b.dataset.tab; state.tab = tab; save(); openDay = null; window.scrollTo(0, 0); render(); return; }
  const act = b.dataset.act, id = b.dataset.id;
  switch (act){
    case 'close': closeSheet(); break;
    case 'dismiss-example': state.example = false; save(); render(); break;
    case 'del-spend': {
      const i = state.spend.findIndex(x => x.id === id); if (i < 0) break;
      const [gone] = state.spend.splice(i, 1); save(); render();
      toast('Deleted ' + rp(gone.amount), () => { state.spend.push(gone); save(); render(); });
      break;
    }
    case 'add-rec': openRec(); break;
    case 'edit-rec': openRec(id); break;
    case 'del-rec': {
      const i = state.recurring.findIndex(x => x.id === id); if (i < 0) break;
      const [gone] = state.recurring.splice(i, 1); save(); closeSheet(); render();
      toast('Deleted ' + gone.name, () => { state.recurring.push(gone); save(); render(); });
      break;
    }
    case 'hist-prev': enterNext = true; histYm = idxYm(ymIdx(histYm) - 1); openDay = null; render(); break;
    case 'hist-next': enterNext = true; histYm = idxYm(ymIdx(histYm) + 1); openDay = null; render(); break;
    case 'toggle-day': openDay = openDay === b.dataset.day ? null : b.dataset.day; render(); break;
    case 'add-on': openAddSpend(b.dataset.day); break;
    case 'use-rec': { const s = summary(state, todayStr().slice(0, 7), 1); $('#fDaily').value = nf.format(s.recommended); break; }
    case 'copy-backup': {
      const text = JSON.stringify(state);
      try { await navigator.clipboard.writeText(text); toast('Backup copied. Paste it into your notes.'); }
      catch (err){ openBackup(text); }
      break;
    }
    case 'start-first': case 'start-today': {
      const v = act === 'start-first' ? todayStr().slice(0, 7) + '-01' : todayStr();
      $('#fStart').value = v;
      document.querySelectorAll('[data-act^="start-"]').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
      break;
    }
    case 'import': openImport(); break;
    case 'erase': openErase(); break;
    case 'erase-yes': state = seed(); state.example = false; save(); closeSheet(); tab = 'today'; render(); toast('Everything erased'); break;
  }
});
$('#addBtn').addEventListener('click', () => openAddSpend(tab === 'history' && openDay ? openDay : null));

// Android back button (only inside the APK): close a sheet, then go back to Today, then leave the app.
try {
  const capApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (capApp) capApp.addListener('backButton', () => {
    if (sheetBg.classList.contains('open')) closeSheet();
    else if (tab !== 'today'){ enterNext = true; spinNext = true; tab = 'today'; state.tab = tab; save(); render(); }
    else capApp.exitApp();
  });
} catch (e){}

// Offline support when installed from the website (not needed inside the APK).
if ('serviceWorker' in navigator && !window.Capacitor && location.protocol === 'https:'){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

// Re-render when the app comes back to the front, so a new day starts on its own.
let lastDay = todayStr();
document.addEventListener('visibilitychange', () => { if (!document.hidden && todayStr() !== lastDay){ lastDay = todayStr(); histYm = lastDay.slice(0, 7); render(); } });
setInterval(() => { if (todayStr() !== lastDay){ lastDay = todayStr(); render(); } }, 60000);

save();
render();
</script>
</body>
</html>
